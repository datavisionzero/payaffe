# The way an installation is run: published images from ghcr.io, no source
# checkout and no build. Download this file and the `.env.example` beside it,
# copy the example to `.env`, fill in the values it asks for, and start.
#
#   docker compose up -d
#
# Upgrading is `docker compose pull` and `docker compose up -d`. The hosts apply
# the schema as they start (ADR 0027); while they do, they answer /health/live
# and report /health/ready as 503. Back up the database before an upgrade —
# there is no downgrade, so that artifact is the rollback.
#
# The root compose.yaml is the other file and is not this one: it builds every
# image from the working tree and is for developing payaffe, not for running it.
#
# The Admin MCP host is not a service here, because it is not a service: it is
# a local stdio process the agent client starts and talks to over stdin, and it
# stays local on purpose (ADR 0023). An installation that wants it points its
# agent client at:
#
#   docker run -i --rm --network payaffe_default \
#     -e ConnectionStrings__Payaffe="Host=db;Port=5432;Database=payaffe;Username=payaffe;Password=..." \
#     -e Mcp__Admin__AdminAccountId="<admin account uuid>" \
#     ghcr.io/datavisionzero/payaffe-mcp:latest
#
# See docs/operations/admin-mcp.md.

name: payaffe

# Webhook secrets of Projects other than the default one are named after the
# Project, `Webhooks__Projects__<project-id>__EndpointSecrets__<name>`, so no
# fixed line below can forward them. The api and worker read them straight from
# `.env` instead; see docs/operations/docker-compose.md.
x-backend-env-file: &backend-env-file
  - path: .env
    required: false

# Configuration shared by every .NET host that talks to the product database.
# The API and the worker read the same settings; only the process topology
# differs.
x-backend-environment: &backend-environment
  # `live` or `test`, recorded in the database on first start and never
  # changed after that (ADR 0033).
  Installation__Mode: ${PAYAFFE_INSTALLATION_MODE:-live}
  ConnectionStrings__Payaffe: Host=db;Port=5432;Database=${PAYAFFE_DB_NAME:-payaffe};Username=${PAYAFFE_DB_USER:-payaffe};Password=${PAYAFFE_DB_PASSWORD:?Set PAYAFFE_DB_PASSWORD in .env}
  # One public address for the whole installation. The API host serves both the
  # browser application and its API, so generated payer links cannot disagree
  # with the application origin.
  Payments__PayerPageBaseUrl: ${PAYAFFE_PUBLIC_URL:?Set PAYAFFE_PUBLIC_URL in .env}/pay
  Payments__ObservedConfirmationWait: ${PAYAFFE_OBSERVED_CONFIRMATION_WAIT:-3.00:00:00}
  Webhooks__EndpointSecrets__partner-v1: ${PAYAFFE_WEBHOOK_ENDPOINT_SECRET_PARTNER_V1:-}
  Webhooks__EndpointSecrets__partner-v2: ${PAYAFFE_WEBHOOK_ENDPOINT_SECRET_PARTNER_V2:-}
  # Webhook Delivery reaches public addresses only, unless the target is named
  # here (ADR 0036): host names, addresses or CIDR ranges, comma separated. The
  # API refuses such an Endpoint and resends from it, so both hosts read it.
  Webhooks__Delivery__AllowedPrivateTargets: ${PAYAFFE_WEBHOOK_ALLOWED_PRIVATE_TARGETS:-}
  ExchangeRates__Enabled: ${PAYAFFE_EXCHANGE_RATES_ENABLED:-true}
  ExchangeRates__BaseUrl: ${PAYAFFE_EXCHANGE_RATES_BASE_URL:-https://api.coingecko.com}
  ExchangeRates__ApiKeyReference: ${PAYAFFE_EXCHANGE_RATES_API_KEY_REFERENCE:-}
  ExchangeRates__CacheInterval: ${PAYAFFE_EXCHANGE_RATES_CACHE_INTERVAL:-00:05:00}
  ExchangeRates__MaxStaleAge: ${PAYAFFE_EXCHANGE_RATES_MAX_STALE_AGE:-00:30:00}
  ExchangeRates__RequestTimeout: ${PAYAFFE_EXCHANGE_RATES_REQUEST_TIMEOUT:-00:00:10}
  ExchangeRates__ProviderSecrets__coingecko: ${PAYAFFE_COINGECKO_API_KEY:-}
  PaymentAddresses__Btc__Enabled: ${PAYAFFE_BTC_WATCH_ONLY_ENABLED:-false}
  PaymentAddresses__Btc__ExtendedPublicKey: ${PAYAFFE_BTC_WATCH_ONLY_EXTENDED_PUBLIC_KEY:-}
  PaymentAddresses__Btc__Network: ${PAYAFFE_BTC_WATCH_ONLY_NETWORK:-mainnet}
  PaymentAddresses__Btc__AddressType: ${PAYAFFE_BTC_WATCH_ONLY_ADDRESS_TYPE:-segwit}
  PaymentAddresses__Btc__StartingIndex: ${PAYAFFE_BTC_WATCH_ONLY_STARTING_INDEX:-0}
  PaymentAddresses__Ltc__Enabled: ${PAYAFFE_LTC_WATCH_ONLY_ENABLED:-false}
  PaymentAddresses__Ltc__ExtendedPublicKey: ${PAYAFFE_LTC_WATCH_ONLY_EXTENDED_PUBLIC_KEY:-}
  PaymentAddresses__Ltc__Network: ${PAYAFFE_LTC_WATCH_ONLY_NETWORK:-mainnet}
  PaymentAddresses__Ltc__AddressType: ${PAYAFFE_LTC_WATCH_ONLY_ADDRESS_TYPE:-segwit}
  PaymentAddresses__Ltc__StartingIndex: ${PAYAFFE_LTC_WATCH_ONLY_STARTING_INDEX:-0}
  PaymentAddresses__NativeEthNetwork: ${PAYAFFE_NATIVE_ETH_NETWORK:-mainnet}
  PaymentAddresses__NativeEthChainId: ${PAYAFFE_NATIVE_ETH_CHAIN_ID:-1}
  PaymentAddresses__NativeEthLowCapacityThreshold: ${PAYAFFE_NATIVE_ETH_LOW_CAPACITY_THRESHOLD:-20}
  BlockchainObservation__Mode: ${PAYAFFE_BLOCKCHAIN_OBSERVATION_MODE:-none}
  BlockchainObservation__Blockchair__BaseUrl: ${PAYAFFE_BLOCKCHAIN_OBSERVATION_BLOCKCHAIR_BASE_URL:-https://api.blockchair.com}
  BlockchainObservation__Blockchair__ApiKeyReference: ${PAYAFFE_BLOCKCHAIN_OBSERVATION_BLOCKCHAIR_API_KEY_REFERENCE:-}
  BlockchainObservation__Blockchair__MaxTransactionsPerAddressPoll: ${PAYAFFE_BLOCKCHAIN_OBSERVATION_BLOCKCHAIR_MAX_TRANSACTIONS_PER_ADDRESS_POLL:-10}
  BlockchainObservation__Nownodes__BtcBaseUrl: ${PAYAFFE_BLOCKCHAIN_OBSERVATION_NOWNODES_BTC_BASE_URL:-https://btcbook.nownodes.io}
  BlockchainObservation__Nownodes__LtcBaseUrl: ${PAYAFFE_BLOCKCHAIN_OBSERVATION_NOWNODES_LTC_BASE_URL:-https://ltcbook.nownodes.io}
  BlockchainObservation__Nownodes__EthBaseUrl: ${PAYAFFE_BLOCKCHAIN_OBSERVATION_NOWNODES_ETH_BASE_URL:-https://eth-blockbook.nownodes.io}
  BlockchainObservation__Nownodes__ApiKeyReference: ${PAYAFFE_BLOCKCHAIN_OBSERVATION_NOWNODES_API_KEY_REFERENCE:-}
  BlockchainObservation__Nownodes__MaxTransactionsPerAddressPoll: ${PAYAFFE_BLOCKCHAIN_OBSERVATION_NOWNODES_MAX_TRANSACTIONS_PER_ADDRESS_POLL:-10}
  # The provider API key itself. It is a reference in the settings above and a
  # value here, so that the key never reaches the database, an audit entry, or
  # a provider observation record (ADR 0021).
  BlockchainObservation__ProviderSecrets__blockchair: ${PAYAFFE_BLOCKCHAIR_API_KEY:-}
  BlockchainObservation__ProviderSecrets__nownodes: ${PAYAFFE_NOWNODES_API_KEY:-}
  # Where log entries go (ADR 0025). Both together or neither: a half
  # configuration is refused at startup rather than losing logs quietly. The
  # token is a secret and it also names the logaffe project entries land in.
  Observability__Logaffe__Url: ${PAYAFFE_LOGAFFE_URL:-}
  Observability__Logaffe__IngestToken: ${PAYAFFE_LOGAFFE_TOKEN:-}
  Observability__OtlpEndpoint: ${PAYAFFE_OTLP_ENDPOINT:-}
  Observability__DeploymentEnvironment: ${PAYAFFE_DEPLOYMENT_ENVIRONMENT:-production}
  # Left empty on purpose: a host then reports the version stamped into its own
  # assembly, which is the version that was actually released. Setting this to
  # the image tag would make telemetry claim "latest".
  Observability__ServiceVersion: ${PAYAFFE_SERVICE_VERSION:-}
  Observability__OperationalMetrics__SnapshotInterval: ${PAYAFFE_OPERATIONAL_METRICS_SNAPSHOT_INTERVAL:-00:00:30}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYAFFE_DB_NAME:-payaffe}
      POSTGRES_USER: ${PAYAFFE_DB_USER:-payaffe}
      POSTGRES_PASSWORD: ${PAYAFFE_DB_PASSWORD:?Set PAYAFFE_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # No published port. The database is reached over the compose network by
    # the hosts that need it, and this volume is the backup target
    # (docs/operations/postgresql-backup-restore.md).
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Not part of an upgrade any more: the hosts apply the schema themselves as
  # they start (ADR 0027). This runs the same code, and stays for the operator
  # who wants the schema applied before anything else is started:
  #
  #   docker compose --profile operations run --rm migrations
  #
  # The same image carries `bootstrap-admin`, which creates the first admin
  # account (ADR 0020) and is the reason this service is still here at all.
  migrations:
    image: ghcr.io/datavisionzero/payaffe-migrations:${PAYAFFE_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    # The same settings as the hosts: applying the schema also records the
    # Installation Mode and seeds the default Project from these values, so a
    # run with less than the hosts' configuration records the wrong ones.
    environment:
      <<: *backend-environment
    profiles:
      - operations

  api:
    image: ghcr.io/datavisionzero/payaffe-api:${PAYAFFE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: *backend-env-file
    environment:
      <<: *backend-environment
      ASPNETCORE_URLS: http://+:8080
      # The worker service owns the background work here, so the API serves
      # requests only. Running both would poll every provider twice; the leases
      # make it safe, not useful.
      Workers__RunInApiHost: ${PAYAFFE_RUN_WORKERS_IN_API_HOST:-false}
      # The address a request came from, which is the proxy's for every caller
      # until the proxy is named (ADR 0032). One or more addresses or CIDR
      # ranges, comma separated; empty means nothing is trusted and the
      # connection is the only truth.
      Network__TrustedProxies: ${PAYAFFE_TRUSTED_PROXIES:-}
      Admin__Authentication__RateLimitPermitLimit: ${PAYAFFE_ADMIN_AUTH_RATE_LIMIT_PERMIT_LIMIT:-30}
      Admin__Authentication__RateLimitWindow: ${PAYAFFE_ADMIN_AUTH_RATE_LIMIT_WINDOW:-00:05:00}
      IntegrationApi__RateLimit__PermitLimit: ${PAYAFFE_INTEGRATION_API_RATE_LIMIT_PERMIT_LIMIT:-120}
      IntegrationApi__RateLimit__Window: ${PAYAFFE_INTEGRATION_API_RATE_LIMIT_WINDOW:-00:01:00}
      # The browser error endpoint is the only unauthenticated surface anybody
      # may post to. The limit is per source address; setting Enabled to false
      # leaves it unmapped entirely.
      Diagnostics__ClientErrors__Enabled: ${PAYAFFE_CLIENT_ERRORS_ENABLED:-true}
      Diagnostics__ClientErrors__RateLimitPermitLimit: ${PAYAFFE_CLIENT_ERROR_RATE_LIMIT_PERMIT_LIMIT:-10}
      Diagnostics__ClientErrors__RateLimitWindow: ${PAYAFFE_CLIENT_ERROR_RATE_LIMIT_WINDOW:-00:01:00}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Bound to the loopback interface by default, because the reverse proxy
    # that terminates TLS is what belongs in front of this. An installation
    # that really is reached directly sets PAYAFFE_BIND_ADDRESS to 0.0.0.0 and
    # accepts that admin sign-in then travels in the clear.
    ports:
      - "${PAYAFFE_BIND_ADDRESS:-127.0.0.1}:${PAYAFFE_API_PORT:-8080}:8080"

  worker:
    image: ghcr.io/datavisionzero/payaffe-worker:${PAYAFFE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: *backend-env-file
    environment:
      <<: *backend-environment
      Payments__LifecycleWorker__Enabled: ${PAYAFFE_LIFECYCLE_WORKER_ENABLED:-true}
      Payments__LifecycleWorker__PollInterval: ${PAYAFFE_LIFECYCLE_WORKER_POLL_INTERVAL:-00:01:00}
      Payments__LifecycleWorker__ExpirationBatchSize: ${PAYAFFE_LIFECYCLE_WORKER_BATCH_SIZE:-100}
      Payments__LifecycleWorker__LeaseDuration: ${PAYAFFE_LIFECYCLE_WORKER_LEASE_DURATION:-00:02:00}
      Payments__ObservationWorker__Enabled: ${PAYAFFE_OBSERVATION_WORKER_ENABLED:-true}
      Payments__ObservationWorker__PollInterval: ${PAYAFFE_OBSERVATION_WORKER_POLL_INTERVAL:-00:01:00}
      Payments__ObservationWorker__MaxPaymentsPerPoll: ${PAYAFFE_OBSERVATION_WORKER_MAX_PAYMENTS_PER_POLL:-25}
      Payments__ObservationWorker__LeaseDuration: ${PAYAFFE_OBSERVATION_WORKER_LEASE_DURATION:-00:02:00}
      Payments__ReorgMonitoringWorker__Enabled: ${PAYAFFE_REORG_MONITORING_WORKER_ENABLED:-true}
      Payments__ReorgMonitoringWorker__PollInterval: ${PAYAFFE_REORG_MONITORING_WORKER_POLL_INTERVAL:-00:05:00}
      Payments__ReorgMonitoringWorker__MaxTransactionsPerPoll: ${PAYAFFE_REORG_MONITORING_WORKER_MAX_TRANSACTIONS_PER_POLL:-25}
      Payments__ReorgMonitoringWorker__LeaseDuration: ${PAYAFFE_REORG_MONITORING_WORKER_LEASE_DURATION:-00:02:00}
      ExchangeRates__RefreshWorker__Enabled: ${PAYAFFE_RATE_REFRESH_WORKER_ENABLED:-true}
      ExchangeRates__RefreshWorker__RefreshInterval: ${PAYAFFE_RATE_REFRESH_WORKER_INTERVAL:-00:05:00}
      ExchangeRates__RefreshWorker__LeaseDuration: ${PAYAFFE_RATE_REFRESH_WORKER_LEASE_DURATION:-00:02:00}
      Webhooks__Delivery__Enabled: ${PAYAFFE_WEBHOOK_DELIVERY_ENABLED:-true}
      Webhooks__Delivery__MaxAttempts: ${PAYAFFE_WEBHOOK_DELIVERY_MAX_ATTEMPTS:-5}
      Webhooks__Delivery__RetryDelay: ${PAYAFFE_WEBHOOK_DELIVERY_RETRY_DELAY:-00:01:00}
      Webhooks__Delivery__RetryBackoffMultiplier: ${PAYAFFE_WEBHOOK_DELIVERY_RETRY_BACKOFF_MULTIPLIER:-2}
      Webhooks__Delivery__MaxRetryDelay: ${PAYAFFE_WEBHOOK_DELIVERY_MAX_RETRY_DELAY:-00:30:00}
      Webhooks__Delivery__RetryJitterRatio: ${PAYAFFE_WEBHOOK_DELIVERY_RETRY_JITTER_RATIO:-0.2}
      Webhooks__Delivery__PollInterval: ${PAYAFFE_WEBHOOK_DELIVERY_POLL_INTERVAL:-00:00:10}
      Webhooks__Delivery__MaxEventsPerPoll: ${PAYAFFE_WEBHOOK_DELIVERY_MAX_EVENTS_PER_POLL:-25}
      Webhooks__Delivery__LeaseDuration: ${PAYAFFE_WEBHOOK_DELIVERY_LEASE_DURATION:-00:02:00}
      Webhooks__Delivery__RequestTimeout: ${PAYAFFE_WEBHOOK_DELIVERY_REQUEST_TIMEOUT:-00:00:30}
      Workers__Health__ProbeInterval: ${PAYAFFE_WORKER_HEALTH_PROBE_INTERVAL:-00:00:15}
      Workers__Health__MaxAge: ${PAYAFFE_WORKER_HEALTH_MAX_AGE:-00:01:00}
    # The worker serves no HTTP endpoint, so the healthcheck runs the same
    # executable with `health`. It reports healthy only while the host still
    # refreshes its heartbeat, which it does only while it can reach the
    # database.
    healthcheck:
      test: ["CMD", "dotnet", "Payaffe.Worker.dll", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db-data:
