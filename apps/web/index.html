<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Non-custodial cryptocurrency payments" />
    <title>payaffe</title>
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("payaffe.theme");
        } catch {
          // Storage can be disabled; system theme remains the safe default.
        }
        const theme = stored === "light" || stored === "dark" ? stored : "system";
        const resolved =
          theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : theme === "system"
              ? "light"
              : theme;
        document.documentElement.classList.add(resolved);
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
