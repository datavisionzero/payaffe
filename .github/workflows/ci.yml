name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So that a run can be started without inventing a commit to carry it.
  workflow_dispatch:

permissions:
  contents: read

# Per branch. Superseded runs are cancelled everywhere except on the trunk,
# because pushing three times to a pull request should cost one run rather than
# three — and a pull request run publishes nothing, so there is no registry tag
# an outdated one could move.
#
# The trunk is the exception, and not cancelling there is the whole point: a
# green push to `main` moves `:main`, so a cancelled run would leave that tag
# on an older commit with nothing saying so. Keeping the group per ref makes
# two quick trunk pushes serialise instead of racing to move the same tag,
# which is what release.yml does for `:latest` for the same reason.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The backend, in one job rather than two. The integration tests start
  # PostgreSQL through Testcontainers and need the Docker daemon a hosted runner
  # already has; splitting them off would mean restoring and building the
  # solution twice to save nothing, because the slow half has to run either way.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore Payaffe.slnx
      - run: dotnet build Payaffe.slnx --configuration Release --no-restore
      - run: dotnet test Payaffe.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Keep the results of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # After setup-node, not before: Corepack installs its shims into the Node
      # that is on PATH, and enabling it first would put them in the one
      # setup-node then replaces. The pnpm version comes from `packageManager`
      # in package.json, so it is the lockfile's own.
      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      # The generated client is committed, and this is what keeps it honest:
      # regenerate it from the checked-in contract and fail if the result
      # differs from what the commit carries. A frontend whose idea of the API
      # has drifted from the API is the failure this catches (ADR 0022).
      - name: The committed API client is the one the contract generates
        run: |
          pnpm --filter @payaffe/web api:generate
          git diff --exit-code -- apps/web/lib/api/generated.ts

      - run: pnpm --filter @payaffe/web test
      - run: pnpm --filter @payaffe/web typecheck

      - name: Install the browser Playwright drives
        run: pnpm --filter @payaffe/web exec playwright install --with-deps chromium
      - run: pnpm --filter @payaffe/web e2e

      - run: pnpm --filter @payaffe/web build

  # Not a build for its own sake: an operator's first contact with this project
  # is `docker compose up`, so the compose file and every image it names have to
  # be buildable from a clean checkout. The MCP host has no compose service
  # (ADR 0023) and is built directly.
  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: The example environment is a usable one
        run: |
          cp .env.example .env
          docker compose config --quiet

      - run: docker compose build migrations api worker
      - run: docker build -f apps/mcp/Dockerfile -t payaffe-mcp:ci .

      # The deployment file names published images, so there is nothing here to
      # build; what can still be wrong is the file itself. Rendering it against
      # its own example is what catches a variable the example stopped
      # providing, which an operator would otherwise find on their first start.
      - name: The deployment Compose file renders from its own example
        run: |
          cd deploy
          sed 's/^PAYAFFE_DB_PASSWORD=$/PAYAFFE_DB_PASSWORD=ci-placeholder/' .env.example > .env
          docker compose config --quiet

  # What a staging installation follows. Every green trunk push moves `:main`;
  # only a release tag moves `:latest`, and that is release.yml's job. The two
  # never touch the same tag, so an installation that never asked for the trunk
  # cannot be dragged onto it by an ordinary `docker compose pull`.
  #
  # It needs all three jobs above, which is the point: `:main` is only ever
  # moved by a commit whose tests passed.
  trunk-images:
    name: Trunk images
    needs: [backend, frontend, deployment]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Same shape as the release matrix: a failure names the image that failed,
      # and four published images with one missing are easier to finish than to
      # diagnose.
      fail-fast: false
      matrix:
        image: [api, worker, migrations, mcp]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only, unlike a release. A release ships both architectures because
      # an operator may be on either (release.yml says why); `:main` is followed
      # by our own staging installation, which is x86. Emulating arm64 for four
      # images on every trunk push would spend minutes per push on an image
      # nothing pulls.
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/datavisionzero/payaffe-${{ matrix.image }}:main
          # A scope of its own rather than the release's. They build different
          # platform sets, and one `mode=max` export overwriting the other's
          # manifest is a slow, confusing way to lose a cache.
          cache-from: type=gha,scope=trunk-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=trunk-${{ matrix.image }}
