name: Release SDK

# The SDK is released on its own tag because it is versioned on its own line.
# An installation release (`v*`) publishes images that report the version in
# Directory.Build.props; this one publishes a NuGet package that reports the
# version in the SDK csproj. Sharing one tag would force every integrator onto
# a new package whenever a server released, and would make a client-only fix
# claim a server release that never happened.
on:
  push:
    tags: ["sdk-v*"]
  # So that a release can be re-run without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to release, for example sdk-v0.1.0"
        required: true

permissions:
  contents: read

# One package release at a time. nuget.org accepts a version once, so two runs
# for the same version would have one of them fail on a conflict; serialising
# them makes the second one's failure mean what it says.
concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  # The tag says what is being released, and this is the only place that reads
  # it. Everything downstream takes the version from here.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      ref: ${{ steps.read.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - id: read
        name: Read the version out of the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          case "$TAG" in
            sdk-v*) version="${TAG#sdk-v}" ;;
            *) echo "An SDK release tag begins with sdk-v: $TAG"; exit 1 ;;
          esac

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Not a version this can release: $version"
            exit 1
          fi

          # The package carries the version the csproj stamps, so the tag and
          # that file have to agree or the release would publish a package
          # nobody tagged. This is the same check release.yml makes against
          # Directory.Build.props, against the file that owns this version.
          csproj=src/Payaffe.Sdk/Payaffe.Sdk.csproj
          prefix="$(grep -oE '<VersionPrefix>[^<]*</VersionPrefix>' "$csproj" | sed -E 's#</?VersionPrefix>##g')"
          suffix="$(grep -oE '<VersionSuffix>[^<]*</VersionSuffix>' "$csproj" | sed -E 's#</?VersionSuffix>##g' || true)"
          if [ -n "$suffix" ]; then
            stamped="$prefix-$suffix"
          else
            stamped="$prefix"
          fi

          if [ "$stamped" != "$version" ]; then
            echo "The tag says $version and $csproj stamps $stamped."
            echo "Bump the version in the commit the tag points at, then re-tag."
            exit 1
          fi

          {
            echo "version=$version"
            echo "ref=$TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing Payaffe.Sdk $version from $TAG."

  # The whole solution, not only the SDK's own tests: what the package promises
  # is checked by the contract and consumer-scenario tests that run the SDK
  # against a server test host, and those live in the API test project.
  publish:
    name: Publish
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing, the same way logaffe publishes its clients. This job
      # asks the Actions service for an OIDC token describing which repository
      # and which workflow file is running, and trades it at nuget.org for a key
      # that lives an hour. Without this permission the token is never issued
      # and the login step below fails.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore Payaffe.slnx
      - run: dotnet build Payaffe.slnx -c Release --no-restore
      - run: dotnet test Payaffe.slnx -c Release --no-build

      # The same check CI runs on every pull request, once more against the
      # commit being released: pack, look inside the package, and consume it
      # from a project that has none of this repository's build files. A package
      # that only works next to its own source is found here rather than by the
      # first integrator.
      - name: The package is consumable from a clean project
        run: scripts/sdk-package-smoke.sh

      # No version argument: the SDK csproj carries the version, and the job
      # above has already refused a tag that disagrees with it.
      - name: Pack
        run: >
          dotnet pack src/Payaffe.Sdk/Payaffe.Sdk.csproj
          -c Release --no-build
          -o "${{ runner.temp }}/nupkg"

      # There is no stored publishing credential. nuget.org holds a policy
      # naming this repository, this workflow file and this account, and hands
      # back a key valid for an hour to a run that matches it — so the thing an
      # attacker would want to steal from this repository does not exist, and
      # there is nothing to rotate on a calendar.
      #
      # The policy is bound to the file name `release-sdk.yml`. Renaming this
      # file breaks publishing until the policy is updated to match, which is
      # worth knowing before somebody tidies it into something shorter.
      #
      # The account name is not secret, but this repository is public and there
      # is no reason to write it down here for a reader who has no use for it.
      - name: A key that expires in an hour
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          # `--skip-duplicate`, so that re-running a release that already
          # published is not an error. A re-run gets a fresh key: the exchanged
          # token is single-use and the key it bought is an hour old at most.
          dotnet nuget push "${{ runner.temp }}/nupkg/"*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Keep the package a maintainer can inspect
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Payaffe.Sdk-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/nupkg/*.nupkg
          if-no-files-found: warn
          retention-days: 14
