name: Release

on:
  push:
    tags: ["v*"]
  # So that a release can be re-run without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to release, for example v0.1.0"
        required: true

permissions:
  contents: read

# One release at a time. Two tags pushed in quick succession would otherwise
# race to move `:latest`, leaving it wherever the slower run finished — which
# can be the older version. Nothing is cancelled: every tag pushed still gets
# released, in the order it was pushed.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag says what is being released, and this is the only place that reads
  # it. Everything downstream takes the version from here rather than parsing
  # the ref again.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      ref: ${{ steps.read.outputs.ref }}
      latest: ${{ steps.read.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - id: read
        name: Read the version out of the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v*) version="${TAG#v}" ;;
            *) echo "A release tag begins with v: $TAG"; exit 1 ;;
          esac

          # What the registry will take and what the build can stamp:
          # major.minor.patch, with an optional prerelease behind it.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Not a version this can release: $version"
            exit 1
          fi

          # The images carry no VERSION build argument: a .NET host reports what
          # Directory.Build.props stamped into it. So the tag and that file have
          # to agree, or the release would publish an image that reports a
          # version nobody tagged.
          # This is the check that keeps the note in Directory.Build.props — bump
          # it in the same commit the tag points at — from being a thing someone
          # has to remember.
          prefix="$(grep -oE '<VersionPrefix>[^<]*</VersionPrefix>' Directory.Build.props | sed -E 's#</?VersionPrefix>##g')"
          suffix="$(grep -oE '<VersionSuffix>[^<]*</VersionSuffix>' Directory.Build.props | sed -E 's#</?VersionSuffix>##g' || true)"
          if [ -n "$suffix" ]; then
            stamped="$prefix-$suffix"
          else
            stamped="$prefix"
          fi

          if [ "$stamped" != "$version" ]; then
            echo "The tag says $version and Directory.Build.props stamps $stamped."
            echo "Bump the version in the commit the tag points at, then re-tag."
            exit 1
          fi

          # `latest` is what an operator following the deployment compose file
          # pulls, so only the highest release may move it. A prerelease must
          # not: someone who never asked for one would be upgraded into it by an
          # ordinary `docker compose pull`. Nor may a patch to an older line --
          # v0.2.1 released after v0.3.0 would otherwise move every such
          # installation backwards. The remote's tags are the list, so a shallow
          # checkout is enough.
          latest=false
          case "$version" in
            *-*) ;;
            *)
              highest="$(git ls-remote --tags --refs origin 'v*' \
                | sed -E 's#.*refs/tags/v##' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -t. -k1,1n -k2,2n -k3,3n \
                | tail -n 1)"
              if [ "$highest" = "$version" ]; then
                latest=true
              else
                echo "v$highest is the highest release, so :latest stays where it is."
              fi
              ;;
          esac

          {
            echo "version=$version"
            echo "ref=$TAG"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing payaffe $version from $TAG."

  # The release gate. A tag does not publish anything its tests did not pass —
  # expressing it here costs one repeated test run and is cheaper than
  # discovering it from a published image. The backend and the frontend are
  # both gated, because the api image ships the built frontend.
  verify:
    name: Verify
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Payaffe.slnx
      - run: dotnet build Payaffe.slnx -c Release --no-restore
      - run: dotnet test Payaffe.slnx -c Release --no-build

  # The same frontend checks CI runs, against the tagged commit.
  verify-frontend:
    name: Verify frontend
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # After setup-node, for the reason ci.yml gives.
      - name: Enable Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @payaffe/web test
      - run: pnpm --filter @payaffe/web typecheck
      - name: Install the browser Playwright drives
        run: pnpm --filter @payaffe/web exec playwright install --with-deps chromium
      - run: pnpm --filter @payaffe/web e2e

  images:
    name: Images
    needs: [version, verify, verify-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Four images from one commit. They are a matrix rather than four steps so
      # that a failure names which one failed, and `fail-fast: false` so a
      # one broken image does not leave the others unpublished for a release
      # that is otherwise fine — an incomplete release is easier to finish than
      # to diagnose.
      fail-fast: false
      matrix:
        image: [api, worker, migrations, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
      # Emulation for the architecture the runner is not. An operator running a
      # shop this size is as likely to be on a cheap ARM host -- Ampere,
      # Graviton, a Pi -- as on x86, and an image that exists for one of the two
      # is an image half of them cannot start. The first release shipped amd64
      # only and this is what that cost.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        name: The names this image is published under
        env:
          NAME: ${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          set -euo pipefail
          {
            echo "value<<TAGS"
            echo "ghcr.io/datavisionzero/payaffe-$NAME:$VERSION"
            if [ "$LATEST" = "true" ]; then
              echo "ghcr.io/datavisionzero/payaffe-$NAME:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      # No build arguments. The .NET hosts report the version Directory.Build.props
      # stamped into them, and the web bundle inside the API image carries no
      # API address on purpose -- one static build works at every installation
      # origin (ADR 0030).
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
